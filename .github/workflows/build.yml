name: CI

on:
    pull_request:
        branches: [master, developed, feature/*, test/*, hotfix/*, fix/*, tech/**]
        types: [opened, reopened, synchronize, ready_for_review]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    verify:
        name: Verify Angular UI
        runs-on: ubuntu-latest
        timeout-minutes: 120
        steps:
            - name: Check out source
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
              with:
                  ref: ${{ github.event.pull_request.head.sha || github.sha }}
                  fetch-depth: 0
                  persist-credentials: false

            - name: Use Node.js 24.10.0
              uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  node-version: 24.10.0
                  cache: npm
                  cache-dependency-path: package-lock.json

            - name: Install dependencies
              run: npm ci --strict-peer-deps --engine-strict

            - name: Validate root dependency graph
              run: npm ls --depth=0

            - name: Validate dependency policy
              run: npm run deps:guard

            - name: Verify framework dependency constraints
              run: npm run deps:verify:framework

            - name: Lint
              run: npm run lint

            - name: Test
              run: npm run test:ci

            - name: Build production application
              run: npm run build:prod
