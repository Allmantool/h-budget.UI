name: Deployment on environment (GitHub)

on:
    workflow_call:
        inputs:
            release_tag:
                required: true
                type: string
    workflow_dispatch:
        inputs:
            release_tag:
                description: Existing immutable vMAJOR.MINOR.PATCH tag to rebuild and deploy.
                required: true
                type: string

permissions:
    contents: read

jobs:
    build-docker:
        name: Build and push Docker image
        runs-on: ubuntu-latest
        environment: production
        concurrency:
            group: h-budget-ui-production
            cancel-in-progress: false
        permissions:
            contents: read
        env:
            IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/homebudget-ui
            RELEASE_TAG: ${{ inputs.release_tag }}
        steps:
            - name: Check out immutable release tag
              uses: actions/checkout@v6
              with:
                  ref: ${{ inputs.release_tag }}
                  fetch-depth: 0

            - id: release-ref
              name: Verify release ref integrity
              shell: bash
              run: |
                  set -euo pipefail
                  if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                    echo "Release tag must use the stable vMAJOR.MINOR.PATCH format: $RELEASE_TAG" >&2
                    exit 1
                  fi
                  if ! git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
                    echo "Release tag does not exist: $RELEASE_TAG" >&2
                    exit 1
                  fi
                  release_sha="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
                  actual_sha="$(git rev-parse HEAD)"
                  if [[ "$actual_sha" != "$release_sha" ]]; then
                    echo "Checked-out commit does not match release tag $RELEASE_TAG." >&2
                    exit 1
                  fi
                  echo "sha=$release_sha" >> "$GITHUB_OUTPUT"
                  echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

            - name: Build Docker image
              env:
                  IMAGE_TAG: ${{ steps.release-ref.outputs.version }}
                  RELEASE_SHA: ${{ steps.release-ref.outputs.sha }}
              run: |
                  set -euo pipefail
                  docker build \
                    --target publish \
                    -t "$IMAGE_NAME:$IMAGE_TAG" \
                    -t "$IMAGE_NAME:sha-$RELEASE_SHA" \
                    --label "org.opencontainers.image.revision=$RELEASE_SHA" \
                    --label "org.opencontainers.image.version=$IMAGE_TAG" \
                    --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
                    --label "org.opencontainers.image.ref.name=$RELEASE_TAG" \
                    .

            - name: Login to Docker Hub
              uses: docker/login-action@v4
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - id: immutable-tags
              name: Validate immutable Docker tags
              env:
                  IMAGE_TAG: ${{ steps.release-ref.outputs.version }}
                  RELEASE_SHA: ${{ steps.release-ref.outputs.sha }}
              shell: bash
              run: |
                  set -euo pipefail
                  IMAGE_TAG="${IMAGE_TAG:?Release image tag was not provided}"
                  RELEASE_SHA="${RELEASE_SHA:?Release SHA was not provided}"
                  validate_tag() {
                    local image_tag="$1"
                    local expected_version="$2"
                    local inspection_output=''
                    if inspection_output="$(docker manifest inspect "$IMAGE_NAME:$image_tag" 2>&1)"; then
                      docker pull "$IMAGE_NAME:$image_tag" >/dev/null
                      remote_revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$IMAGE_NAME:$image_tag")"
                      remote_version="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' "$IMAGE_NAME:$image_tag")"
                      if [[ "$remote_revision" != "$RELEASE_SHA" || ( -n "$expected_version" && "$remote_version" != "$expected_version" ) ]]; then
                        echo "Existing image tag points to a different release: $IMAGE_NAME:$image_tag" >&2
                        exit 1
                      fi
                      echo "$3=false" >> "$GITHUB_OUTPUT"
                    elif [[ "$inspection_output" != *'no such manifest'* && "$inspection_output" != *'manifest unknown'* ]]; then
                      echo "Unable to confirm that Docker image tag is unused: $IMAGE_NAME:$image_tag" >&2
                      exit 1
                    else
                      echo "$3=true" >> "$GITHUB_OUTPUT"
                    fi
                  }
                  validate_tag "$IMAGE_TAG" "$IMAGE_TAG" push_version_tag
                  validate_tag "sha-$RELEASE_SHA" '' push_sha_tag

            - name: Push immutable Docker image tags
              env:
                  IMAGE_TAG: ${{ steps.release-ref.outputs.version }}
                  RELEASE_SHA: ${{ steps.release-ref.outputs.sha }}
              run: |
                  set -euo pipefail
                  if [[ "${{ steps.immutable-tags.outputs.push_version_tag }}" == true ]]; then docker push "$IMAGE_NAME:$IMAGE_TAG"; fi
                  if [[ "${{ steps.immutable-tags.outputs.push_sha_tag }}" == true ]]; then docker push "$IMAGE_NAME:sha-$RELEASE_SHA"; fi
