name: Release

on:
    push:
        branches: [master]

permissions:
    contents: read

concurrency:
    group: semantic-release-master
    cancel-in-progress: false

jobs:
    release:
        name: Verify and publish release
        runs-on: ubuntu-latest
        timeout-minutes: 120
        outputs:
            release_tag: ${{ steps.publish.outputs.release_tag }}
            release_sha: ${{ steps.publish.outputs.release_sha }}
        permissions:
            actions: write
            contents: write
        steps:
            - name: Check out master with tags
              uses: actions/checkout@v6
              with:
                  ref: ${{ github.sha }}
                  fetch-depth: 0

            - name: Verify triggering master revision
              env:
                  TRIGGERING_REF: ${{ github.ref }}
                  TRIGGERING_SHA: ${{ github.sha }}
              shell: bash
              run: |
                  set -euo pipefail
                  head_sha="$(git rev-parse HEAD)"
                  if [[ "$head_sha" != "$TRIGGERING_SHA" ]]; then
                    echo "Release checkout does not match the triggering master revision." >&2
                    exit 1
                  fi
                  echo "triggering_ref=$TRIGGERING_REF"
                  echo "triggering_sha=$TRIGGERING_SHA"
                  echo "head_sha=$head_sha"
                  echo "origin_master_sha=$(git rev-parse origin/master)"
                  echo "describe=$(git describe --tags --always)"
                  git log -5 --oneline --decorate

            - name: Use Node.js 24.10.0
              uses: actions/setup-node@v6
              with:
                  node-version: 24.10.0
                  cache: npm
                  cache-dependency-path: package-lock.json

            - name: Install dependencies
              run: npm ci --strict-peer-deps --engine-strict

            - name: Validate root dependency graph
              run: npm ls --depth=0

            - name: Validate dependency policy
              run: npm run deps:guard

            - name: Verify dependency registry metadata
              run: npm run deps:guard:online

            - name: Verify framework dependency constraints
              run: npm run deps:verify:framework

            - name: Lint
              run: npm run lint

            - name: Test
              run: npm run test:ci

            - name: Run SonarQube analysis
              env:
                  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
              run: npm run sonar -Dsonar.login="$SONAR_TOKEN"

            - name: Build production application
              run: npm run build:prod

            - id: publish
              name: Publish GitHub Release and immutable tag
              env:
                  GITHUB_TOKEN: ${{ github.token }}
              shell: bash
              run: |
                  set -euo pipefail
                  git tag --points-at HEAD --list 'v*' | sort > tags-before.txt
                  previous_tag="$(git tag --merged HEAD --list 'v*' --sort=-version:refname | head -n 1)"
                  npx --no-install semantic-release
                  git tag --points-at HEAD --list 'v*' | sort > tags-after.txt
                  release_tag="$(comm -13 tags-before.txt tags-after.txt)"
                  if [[ -n "$release_tag" && ! "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                    echo "semantic-release created an invalid stable tag: $release_tag" >&2
                    exit 1
                  fi
                  if [[ -n "$release_tag" ]]; then
                    release_sha="$(git rev-parse "refs/tags/$release_tag^{commit}")"
                    if [[ "$release_sha" != "$(git rev-parse HEAD)" ]]; then
                      echo "semantic-release tag $release_tag does not point at the release commit." >&2
                      exit 1
                    fi
                    {
                      echo "release_tag=$release_tag"
                      echo "release_sha=$release_sha"
                      echo "previous_tag=$previous_tag"
                    } >> "$GITHUB_OUTPUT"
                  fi

            - name: Dispatch versioned deployment
              if: steps.publish.outputs.release_tag != ''
              env:
                  GH_TOKEN: ${{ github.token }}
                  RELEASE_TAG: ${{ steps.publish.outputs.release_tag }}
                  RELEASE_SHA: ${{ steps.publish.outputs.release_sha }}
              run: >-
                  gh workflow run github-deployment.yml --ref master
                  --field release_tag="$RELEASE_TAG" --field release_sha="$RELEASE_SHA"
                  --field redeploy=false

            - name: Write release summary
              if: always()
              env:
                  PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
                  RELEASE_TAG: ${{ steps.publish.outputs.release_tag }}
                  RELEASE_SHA: ${{ steps.publish.outputs.release_sha }}
                  PREVIOUS_TAG: ${{ steps.publish.outputs.previous_tag }}
              shell: bash
              run: |
                  if [[ "$PUBLISH_OUTCOME" != 'success' ]]; then
                    echo '# Release publication failed' >> "$GITHUB_STEP_SUMMARY"
                    exit 0
                  fi
                  if [[ -z "$RELEASE_TAG" ]]; then
                    {
                      echo '# No Release Required'
                      echo ''
                      echo 'No release-producing Conventional Commits were found since the previous stable release.'
                    } >> "$GITHUB_STEP_SUMMARY"
                    exit 0
                  fi
                  {
                    echo "# 🚀 Release $RELEASE_TAG"
                    echo ''
                    echo '| Property | Value |'
                    echo '|---|---|'
                    echo "| Version | \`${RELEASE_TAG#v}\` |"
                    echo "| Tag | \`$RELEASE_TAG\` |"
                    echo "| Commit | \`$RELEASE_SHA\` |"
                    echo "| Previous release | \`${PREVIOUS_TAG:-none}\` |"
                    echo "| Branch | \`master\` |"
                    echo '| Deployment | dispatched |'
                    echo ''
                    echo "[View GitHub Release]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG)"
                  } >> "$GITHUB_STEP_SUMMARY"
