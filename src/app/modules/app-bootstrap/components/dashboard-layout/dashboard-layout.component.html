<div class="workspace-shell">
	<section class="workspace-main">
		<header class="workspace-header">
			<div>
				<p class="workspace-header__eyebrow">Workspace</p>
				<h2 class="workspace-header__title">{{ currentSectionSignal()?.label || 'Overview' }}</h2>
			</div>
		</header>

		<div class="workspace-main__content">
			<router-outlet #rootAppOutlet="outlet"></router-outlet>
		</div>
	</section>

	@if (isDataLoading$ | async) {
	<div class="overlay">
		<div class="spinner-wrapper">
			<progress-spinner [isLoading]="!rootAppOutlet.isActivated && (isDataLoading$ | async)"></progress-spinner>
		</div>
	</div>
	}
</div>
