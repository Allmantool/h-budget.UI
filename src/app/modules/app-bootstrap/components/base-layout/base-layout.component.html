<div class="app-shell">
	<aside class="app-shell__sidebar">
		<div class="app-shell__brand">
			<div class="app-shell__brand-mark">HB</div>
			<div>
				<p class="app-shell__eyebrow">Home Ledger</p>
				<strong>Personal finance</strong>
			</div>
		</div>

		<nav
			class="app-shell__nav"
			aria-label="Primary"
		>
			@for (navigationItem of primaryNavigationItems; track navigationItem) {
			<a
				class="app-shell__nav-item"
				[class.app-shell__nav-item--active]="isRouteActive(navigationItem.route)"
				[routerLink]="navigationItem.route"
			>
				<span class="material-icons app-shell__nav-icon">{{ navigationItem.icon }}</span>
				<span>{{ navigationItem.label }}</span>
			</a>
			}
		</nav>
	</aside>

	<main class="app-shell__main">
		<div class="app-shell__content">
			<router-outlet></router-outlet>
		</div>
	</main>
</div>
