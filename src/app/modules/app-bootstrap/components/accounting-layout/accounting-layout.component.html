<div
	class="accounting-shell"
	[class.accounting-shell--detail-open]="isDetailOpen"
>
	<section class="accounting-main">
		<header class="accounting-header">
			<div>
				<h1 class="accounting-header__title">Accounts and payments</h1>
				<p class="accounting-copy">Select an account, then review or record its payments.</p>
			</div>
		</header>

		<div class="accounting-main__content">
			<router-outlet #rootAppOutlet="outlet"></router-outlet>
		</div>
	</section>

	<aside
		class="accounting-detail"
		[class.accounting-detail--active]="isDetailOpen"
	>
		<router-outlet
			name="right_sidebar"
			(activate)="openDetail()"
			(deactivate)="closeDetail()"
		></router-outlet>
	</aside>

	@if (!rootAppOutlet.isActivated && (isDataLoading$ | async)) {
	<div class="overlay">
		<div class="spinner-wrapper">
			<progress-spinner [isLoading]="!rootAppOutlet.isActivated && (isDataLoading$ | async)"></progress-spinner>
		</div>
	</div>
	}
</div>
